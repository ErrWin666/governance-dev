name: secret-scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan PR diff for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan commits introduced by this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --log-opts="${BASE_SHA}..HEAD" \
            --config .gitleaks.toml \
            --redact --exit-code 1 \
            .
