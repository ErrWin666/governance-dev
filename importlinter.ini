[importlinter]
# Layer B (B1) dependency contracts.
# root_package is set per project; governance-dev uses `risky_pkg` for verification.
# Contract types: forbidden | independence | layers
# See https://import-linter.readthedocs.io for contract syntax.
root_package = risky_pkg

[importlinter:contract:1]
name = risky_pkg.b must not import risky_pkg.a (cycle guard)
type = forbidden
source_modules =
    risky_pkg.b
forbidden_modules =
    risky_pkg.a
